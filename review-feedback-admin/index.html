  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    .animate-slide-up { animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    /* 自定义滑块样式 */
    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: #3b82f6;
      cursor: pointer;
      margin-top: -8px;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.4);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #e2e8f0;
      border-radius: 4px;
    }
    input[type=range]:focus {
      outline: none;
    }
  </style>
</head>

    const SetReviewModal = ({ course, onClose, onSave }) => {
      const [excellentCount, setExcellentCount] = useState(course.reviewConfig?.excellentCount ?? 20);
      const [qualifiedCount, setQualifiedCount] = useState(course.reviewConfig?.qualifiedCount ?? 30);
      const [startTime, setStartTime] = useState(course.reviewConfig?.startTime || '2026-08-20');
      const [endTime, setEndTime] = useState(course.reviewConfig?.endTime || '2026-08-30');
      const [selectedTeachers, setSelectedTeachers] = useState(course.reviewConfig?.teachers || []);
      
      const toggleTeacher = (tId) => {
        if(selectedTeachers.includes(tId)) setSelectedTeachers(selectedTeachers.filter(id => id !== tId));
        else setSelectedTeachers([...selectedTeachers, tId]);
      }

      const maxPerTeacher = Math.max(1, Math.floor(course.completed / Math.max(1, selectedTeachers.length)));
      const updateReviewCount = (value, setter) => {
        const nextValue = Number(value);
        if (Number.isNaN(nextValue)) return;
        setter(Math.min(maxPerTeacher, Math.max(0, Math.round(nextValue))));
      };

      const reviewCountPerTeacher = excellentCount + qualifiedCount;
      const totalReviewCount = reviewCountPerTeacher * selectedTeachers.length;
      const canSave = reviewCountPerTeacher >= 1 && totalReviewCount <= course.completed && selectedTeachers.length > 0;

      return (

                  <span>课程结束时间：<strong className="text-slate-700">{course.endTime}</strong></span>
                </div>
              </div>

              <div className="space-y-8">
                {/* 评审数量 */}
                <div>
                  <label className="block mb-3">
                    <span className="font-bold text-slate-800">1. 设定评审学生数量 <span className="text-red-500">*</span></span>
                  </label>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="rounded-xl border border-emerald-200 bg-emerald-50/40 p-4">
                      <div className="text-sm font-bold text-emerald-700 mb-3">优秀人数</div>
                      <div className="flex items-center border border-slate-300 rounded-lg overflow-hidden bg-white focus-within:ring-2 focus-within:ring-emerald-500/20 focus-within:border-emerald-500">
                        <button type="button" onClick={() => updateReviewCount(excellentCount - 1, setExcellentCount)} className="w-10 h-10 text-xl text-slate-500 hover:bg-slate-50 border-r border-slate-200">−</button>
                        <input type="number" min="0" max={maxPerTeacher} value={excellentCount} onChange={(e) => updateReviewCount(e.target.value, setExcellentCount)} className="w-full h-10 text-center text-lg font-bold text-emerald-600 outline-none [appearance:textfield]" />
                        <button type="button" onClick={() => updateReviewCount(excellentCount + 1, setExcellentCount)} className="w-10 h-10 text-xl text-slate-500 hover:bg-slate-50 border-l border-slate-200">＋</button>
                      </div>
                      <div className="text-xs text-slate-500 mt-2 text-center">人 / 每位教师</div>
                    </div>
                    <div className="rounded-xl border border-blue-200 bg-blue-50/40 p-4">
                      <div className="text-sm font-bold text-blue-700 mb-3">合格人数</div>

                                <p className="text-[13px] text-slate-600 bg-slate-50 p-2.5 rounded border border-slate-100">{task.comments.pros}</p>
                              </div>
                              <div>
                                <span className="inline-block text-[12px] font-bold text-amber-700 bg-amber-50 px-2 py-0.5 rounded border border-amber-100 mb-1.5">不足</span>
                                <p className="text-[13px] text-slate-600 bg-slate-50 p-2.5 rounded border border-slate-100">{task.comments.cons}</p>
                              </div>
                              <div>
                                <span className="inline-block text-[12px] font-bold text-blue-700 bg-blue-50 px-2 py-0.5 rounded border border-blue-100 mb-1.5">修改建议</span>
                                <p className="text-[13px] text-slate-600 bg-slate-50 p-2.5 rounded border border-slate-100">{task.comments.improve}</p>
                              </div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>

                <div className="px-6 py-4 border-t border-slate-100 bg-white flex justify-end shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                  <button onClick={() => setSelectedRecord(null)} className="px-8 py-2.5 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700 transition-colors shadow-sm">关闭阅读</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    };

    const INITIAL_FEEDBACK_COURSES = [
      {
        id: 'C01', name: 'AI 产品经理核心工作流拆解', completed: 1100, endTime: '2026-08-30 23:59', feedbackCount: null,
        responses: []
      },
      {
        id: 'C02', name: '点燃计划 | 第16期前端架构实战', completed: 750, endTime: '2026-08-15 23:59', feedbackCount: 120,
        responses: [
          { id: 'S202608001', name: '陈雨欣', submitTime: '2026-08-19 16:22:08', answers: ['比较符合', '非常有帮助', '比较准确', '很清楚，可以直接修改', ['评语更具体', '修改建议更可执行'], '希望针对作品中的具体页面给出更多修改示例。'] },
          { id: 'S202608017', name: '周子涵', submitTime: '2026-08-19 15:06:31', answers: ['一般', '比较有帮助', '一般', '比较清楚', ['分数更准确', '更能识别我提交的文件内容'], '上传的视频内容似乎没有被完整识别，评分与实际完成度有偏差。'] },
          { id: 'S202608026', name: '林嘉诚', submitTime: '2026-08-18 20:41:55', answers: ['非常符合', '非常有帮助', '很准确', '很清楚，可以直接修改', ['反馈速度更快'], ''] }
        ]
      },
      {
        id: 'C03', name: 'AIGC 商业插画实战训练营', completed: 2000, endTime: '2026-07-30 23:59', feedbackCount: 300,
        responses: [
          { id: 'S202607108', name: '许梦瑶', submitTime: '2026-08-09 11:32:14', answers: ['不太符合', '一般', '不太准确', '一般', ['分数更准确', '评语更具体'], '人物手部细节被识别成了主体结构问题，希望评分时区分问题严重程度。'] }
        ]
      }
    ];

    const FEEDBACK_QUESTIONS = [
      'AI 给出的等级和分数是否符合你的作业完成情况？',
      'AI 评语是否能帮助你理解本次作业的主要表现？',
      'AI 指出的优点和不足是否准确？',
      'AI 给出的修改建议是否清楚、可执行？',
      '本次评审中，你最希望 AI 改进哪一部分？',
      '如果你认为本次评审存在明显问题，请简单说明。'
    ];

    const FeedbackSettingModal = ({ course, onClose, onSave }) => {
      const [count, setCount] = useState(course.feedbackCount || Math.min(100, course.completed));
      const updateCount = value => {
        const next = Number(value);
        if (!Number.isNaN(next)) setCount(Math.min(course.completed, Math.max(1, Math.round(next))));
      };
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm animate-fade-in">
          <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden animate-slide-up">
            <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
              <h3 className="font-extrabold text-slate-800 text-lg flex items-center"><Icons.Settings className="mr-2 text-blue-600" /> 设置学生反馈规则</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icons.X /></button>
            </div>
            <div className="p-6">
              <div className="bg-blue-50/60 border border-blue-100 rounded-xl p-4 mb-6">
                <div className="text-xs font-bold text-blue-600 mb-1">当前配置课程</div>
                <div className="font-bold text-slate-800">{course.name}</div>
                <div className="text-sm text-slate-500 mt-2">学习完成人数：<strong>{course.completed}</strong> 人</div>
              </div>
              <label className="block font-bold text-slate-800 mb-3">出现学生反馈问卷的人数 <span className="text-red-500">*</span></label>
              <div className="flex items-center gap-3">
                <div className="flex items-center w-60 border border-slate-300 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500">
                  <button onClick={() => updateCount(count - 1)} className="w-11 h-11 text-xl text-slate-500 border-r border-slate-200 hover:bg-slate-50">−</button>
                  <input type="number" min="1" max={course.completed} value={count} onChange={e => updateCount(e.target.value)} className="w-full h-11 text-center text-lg font-bold text-blue-600 outline-none" />
                  <button onClick={() => updateCount(count + 1)} className="w-11 h-11 text-xl text-slate-500 border-l border-slate-200 hover:bg-slate-50">＋</button>
                </div>
                <span className="font-medium text-slate-600">人</span>
              </div>
              <p className="text-xs text-slate-500 mt-3">系统将在已完成学习的学生中随机选择 {count} 人展示反馈问卷。</p>
            </div>
            <div className="p-5 border-t border-slate-100 bg-slate-50 flex justify-end gap-3">
              <button onClick={onClose} className="px-6 py-2.5 rounded-lg text-sm font-bold text-slate-600 bg-white border border-slate-300">取消</button>
              <button onClick={() => onSave(count)} className="px-7 py-2.5 rounded-lg text-sm font-bold text-white bg-blue-600 hover:bg-blue-700">保存设置</button>
            </div>
          </div>
        </div>
      );
    };

    const StudentFeedbackDetailModal = ({ response, courseName, onClose }) => (
      <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/45 backdrop-blur-sm animate-fade-in">
        <div className="bg-white w-full max-w-2xl max-h-[82vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-slide-up">
          <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
            <div>
              <h3 className="font-extrabold text-slate-800 text-lg">学生反馈详情</h3>
              <p className="text-xs text-slate-500 mt-1">{courseName}</p>
            </div>
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icons.X /></button>
          </div>
          <div className="p-6 overflow-y-auto">
            <div className="flex items-center justify-between bg-blue-50/60 border border-blue-100 rounded-xl p-4 mb-5">
              <div><div className="font-bold text-slate-800">{response.name}</div><div className="text-xs text-slate-500 mt-1">学号：{response.id}</div></div>
              <div className="text-xs text-slate-500">提交时间：{response.submitTime}</div>
            </div>
            <div className="space-y-4">
              {FEEDBACK_QUESTIONS.map((question, index) => {
                const answer = response.answers[index];
                return (
                  <div key={question} className="border border-slate-200 rounded-xl p-4">
                    <div className="text-sm font-bold text-slate-700 mb-2">{index + 1}. {question}</div>
                    <div className="text-sm text-blue-700 bg-blue-50 rounded-lg px-3 py-2 leading-relaxed">{Array.isArray(answer) ? answer.join('、') : answer || '未填写'}</div>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      </div>
    );

    const FeedbackResponsesModal = ({ course, onClose, onView }) => (
      <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-sm animate-fade-in">
        <div className="bg-white w-full max-w-4xl max-h-[80vh] rounded-2xl shadow-2xl overflow-hidden flex flex-col animate-slide-up">
          <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
            <div><h3 className="font-extrabold text-slate-800 text-lg">学生反馈记录</h3><p className="text-xs text-slate-500 mt-1">{course.name}</p></div>
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600"><Icons.X /></button>
          </div>
          <div className="p-6 overflow-y-auto">
            {course.responses.length ? (
              <table className="w-full text-left text-sm border border-slate-200 rounded-xl overflow-hidden">
                <thead className="bg-slate-50 text-slate-500"><tr><th className="px-5 py-3">学生</th><th className="px-5 py-3">学号</th><th className="px-5 py-3">提交时间</th><th className="px-5 py-3 text-right">操作</th></tr></thead>
                <tbody className="divide-y divide-slate-100">{course.responses.map(item => <tr key={item.id} className="hover:bg-slate-50"><td className="px-5 py-4 font-bold">{item.name}</td><td className="px-5 py-4 text-slate-500 font-mono">{item.id}</td><td className="px-5 py-4 text-slate-500">{item.submitTime}</td><td className="px-5 py-4 text-right"><button onClick={() => onView(item)} className="text-blue-600 font-bold hover:text-blue-700">查看反馈</button></td></tr>)}</tbody>
              </table>
            ) : <div className="py-16 text-center text-slate-400">暂未收到学生反馈</div>}
          </div>
        </div>
      </div>
    );

    const FeedbackResponsesPage = ({ course, onBack }) => {
      const [studentKeyword, setStudentKeyword] = useState('');
      const [appliedKeyword, setAppliedKeyword] = useState('');
      const filteredResponses = course.responses.filter(response => response.name.includes(appliedKeyword.trim()));
      return (
      <div className="absolute inset-0 flex flex-col bg-[#f0f2f5] animate-fade-in">
        <div className="bg-white border-b border-slate-200 px-8 py-4 flex items-center gap-4 shrink-0 shadow-sm">
          <button onClick={onBack} className="w-9 h-9 flex items-center justify-center rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-colors" title="返回课程列表">
            <Icons.ArrowLeft />
          </button>
          <div>
            <h2 className="text-lg font-extrabold text-slate-800">学生反馈记录</h2>
            <div className="text-xs text-slate-500 mt-1">{course.name}</div>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto p-8">
          <div className="w-full max-w-[1600px] mx-auto">
            <div className="grid grid-cols-3 gap-5 mb-6">
              <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm min-h-[104px] flex flex-col items-center justify-center text-center"><div className="text-sm text-slate-500 mb-2">问卷出现人数</div><div className="text-2xl font-extrabold text-blue-600">{course.feedbackCount} <span className="text-sm font-normal text-slate-400">人</span></div></div>
              <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm min-h-[104px] flex flex-col items-center justify-center text-center"><div className="text-sm text-slate-500 mb-2">已提交反馈</div><div className="text-2xl font-extrabold text-emerald-600">{course.responses.length} <span className="text-sm font-normal text-slate-400">人</span></div></div>
              <div className="bg-white border border-slate-200 rounded-xl p-5 shadow-sm min-h-[104px] flex flex-col items-center justify-center text-center"><div className="text-sm text-slate-500 mb-2">反馈提交率</div><div className="text-2xl font-extrabold text-indigo-600">{course.feedbackCount ? Math.round(course.responses.length / course.feedbackCount * 100) : 0}%</div></div>
            </div>
            {course.responses.length ? (
              <div className="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
                <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
                  <div className="font-bold text-slate-800">全部学生反馈 <span className="ml-1 text-sm font-normal text-slate-400">共 {filteredResponses.length} 条</span></div>
                  <div className="flex items-center gap-2">
                    <div className="relative w-64">
                      <input type="text" value={studentKeyword} onChange={e => setStudentKeyword(e.target.value)} onKeyDown={e => e.key === 'Enter' && setAppliedKeyword(studentKeyword)} placeholder="输入学生姓名检索" className="w-full pl-4 pr-9 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20" />
                      {studentKeyword && <button onClick={() => { setStudentKeyword(''); setAppliedKeyword(''); }} className="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">×</button>}
                    </div>
                    <button onClick={() => setAppliedKeyword(studentKeyword)} className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-sm font-bold shadow-sm">搜索</button>
                  </div>
                </div>
                <div>
                  <table className="w-full table-fixed text-left text-xs">
                    <thead className="bg-slate-50 text-slate-600 border-b border-slate-200">
                      <tr>
                        <th className="px-3 py-4 w-[4%] text-center">序号</th>
                        <th className="px-3 py-4 w-[7%]">学生姓名</th>
                        <th className="px-3 py-4 w-[8%]">提交日期</th>
                        {FEEDBACK_QUESTIONS.map((question, index) => <th key={question} className={`px-3 py-4 align-top ${index === 5 ? 'w-[16%]' : 'w-[13%]'}`}><div className="text-[11px] text-blue-600 mb-1">问题 {index + 1}</div><div className="leading-relaxed break-words">{question}</div></th>)}
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {filteredResponses.map((response, studentIndex) => (
                        <tr key={response.id} className="hover:bg-blue-50/30 align-top">
                          <td className="px-3 py-5 font-bold text-slate-400 text-center">{studentIndex + 1}</td>
                          <td className="px-3 py-5"><div className="font-extrabold text-slate-800 break-words">{response.name}</div></td>
                          <td className="px-3 py-5 text-slate-500 break-words">{response.submitTime.split(' ')[0]}</td>
                          {response.answers.map((answer, index) => <td key={index} className="px-3 py-5"><div className={`rounded-lg px-2.5 py-2 leading-relaxed break-words whitespace-normal ${index === 5 ? 'bg-slate-50 text-slate-700' : 'bg-blue-50 text-blue-700 font-medium'}`}>{Array.isArray(answer) ? answer.join('、') : answer || '未填写'}</div></td>)}
                        </tr>
                      ))}
                      {filteredResponses.length === 0 && <tr><td colSpan="9" className="py-16 text-center text-slate-400">未找到匹配的学生反馈</td></tr>}
                    </tbody>
                  </table>
                </div>
              </div>
            ) : (
              <div className="bg-white border border-slate-200 rounded-2xl py-20 text-center text-slate-400">暂未收到学生反馈</div>
            )}
          </div>
        </div>
      </div>
      );
    };

    const StudentFeedbackManagement = () => {
      const [courses, setCourses] = useState(INITIAL_FEEDBACK_COURSES);
      const [settingCourse, setSettingCourse] = useState(null);
      const [responsesCourse, setResponsesCourse] = useState(null);
      const saveCount = count => {
        setCourses(prev => prev.map(item => item.id === settingCourse.id ? {...item, feedbackCount: count} : item));
        setSettingCourse(null);
      };
      if (responsesCourse) {
        return <FeedbackResponsesPage course={responsesCourse} onBack={() => setResponsesCourse(null)} />;
      }
      return (
        <div className="absolute inset-0 overflow-y-auto p-8 animate-fade-in">
          <div className="mb-6"><h2 className="text-xl font-extrabold text-slate-800">课程学生反馈管理</h2><p className="text-sm text-slate-500 mt-1">配置随机展示反馈问卷的学生人数，并查看每位学生的反馈意见。</p></div>
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <table className="w-full text-left text-sm">
              <thead className="bg-slate-50 text-slate-500 border-b border-slate-200"><tr><th className="px-6 py-4">课程名称</th><th className="px-6 py-4">学习完成人数</th><th className="px-6 py-4">问卷出现人数</th><th className="px-6 py-4">已提交反馈</th><th className="px-6 py-4 text-right">操作</th></tr></thead>
              <tbody className="divide-y divide-slate-100">
                {courses.map(course => <tr key={course.id} className="hover:bg-slate-50/60"><td className="px-6 py-5"><div className="font-bold text-slate-800">{course.name}</div><div className="text-xs text-slate-400 font-mono mt-1">ID: {course.id}</div></td><td className="px-6 py-5">{course.completed} 人</td><td className="px-6 py-5">{course.feedbackCount ? <span className="font-bold text-blue-600">{course.feedbackCount} 人</span> : <span className="text-slate-400">未设置</span>}</td><td className="px-6 py-5"><span className="font-bold text-emerald-600">{course.responses.length}</span> <span className="text-slate-400">/ {course.feedbackCount || 0}</span></td><td className="px-6 py-5 text-right space-x-2"><button onClick={() => setSettingCourse(course)} className="px-4 py-2 border border-slate-300 rounded-lg font-bold text-slate-600 hover:bg-slate-50">{course.feedbackCount ? '修改设置' : '设置反馈'}</button><button disabled={!course.feedbackCount} onClick={() => setResponsesCourse(course)} className="px-4 py-2 rounded-lg font-bold text-white bg-blue-600 hover:bg-blue-700 disabled:bg-slate-300">查看反馈</button></td></tr>)}
              </tbody>
            </table>
          </div>
          {settingCourse && <FeedbackSettingModal course={settingCourse} onClose={() => setSettingCourse(null)} onSave={saveCount} />}
        </div>
      );
    };

    function App() {
      const [currentMenu, setCurrentMenu] = useState('teacher_review');
      const [courses, setCourses] = useState(INITIAL_COURSES);
      
      // State management for navigation flow
      const [activeCourseId, setActiveCourseId] = useState(null); // Which course we are looking at
      const [isSettingModalOpen, setIsSettingModalOpen] = useState(false);
      const [isProgressViewOpen, setIsProgressViewOpen] = useState(false);
      
      const [selectedTeacher, setSelectedTeacher] = useState(null); // For drilling down into teacher details

      // Helpers
      const activeCourse = courses.find(c => c.id === activeCourseId);

      // Handlers
      const handleOpenSetting = (course) => {
        setActiveCourseId(course.id);
        setIsSettingModalOpen(true);
      };

      const handleSaveSetting = (config) => {
        // Mock save action: change status to in_progress
        setCourses(prev => prev.map(c => {
          if (c.id === activeCourseId) {
            return {
              ...c, 
              status: 'in_progress',
              reviewConfig: config,
              reviewProgress: { total: config.reviewCount, completed: 0, pending: config.reviewCount },
              teacherStatus: { pending: MOCK_TEACHERS.filter(t => config.teachers.includes(t.id)).map(({id, name}) => ({id, name})), completed: [] }
            };
          }
          return c;
        }));
        setIsSettingModalOpen(false);
      };

      const handleOpenProgress = (course) => {
        setActiveCourseId(course.id);
        setIsProgressViewOpen(true);
      };

      const handleCloseProgress = () => {
        setIsProgressViewOpen(false);
        setActiveCourseId(null);
      };

      return (
        <AdminLayout currentMenu={currentMenu} setCurrentMenu={setCurrentMenu}>
          
          {/* Main List View */}
          {currentMenu === 'teacher_review' && !isProgressViewOpen && (
            <CourseListView 
              courses={courses} 
              onSetReview={handleOpenSetting}
              onViewProgress={handleOpenProgress}
            />
          )}

          {/* Detailed Progress View (Full Screen overlay within Main Area) */}
          {currentMenu === 'teacher_review' && isProgressViewOpen && activeCourse && (
            <CourseProgressView 
              course={activeCourse} 
              onBack={handleCloseProgress}
              onViewTeacherDetails={(t) => setSelectedTeacher(t)}
            />
          )}

          {/* Setting Modal */}
          {isSettingModalOpen && activeCourse && (
            <SetReviewModal 
              course={activeCourse} 
              onClose={() => setIsSettingModalOpen(false)}
              onSave={handleSaveSetting}
            />
          )}

          {/* Teacher Details Modal */}
          {selectedTeacher && activeCourse && (
            <TeacherGradingDetailsModal
              teacher={selectedTeacher}
              courseName={activeCourse.name}
              onClose={() => setSelectedTeacher(null)}
            />
          )}

          {/* Dashboard Mock View */}
          {currentMenu === 'dashboard' && (
            <div className="absolute inset-0 flex items-center justify-center bg-slate-50 text-slate-400">
               <div className="text-center">
                 <Icons.Home className="w-16 h-16 mx-auto mb-4 opacity-20" />
                 <p>欢迎来到管理后台，请在左侧选择具体业务模块进行操作。</p>
               </div>
            </div>
          )}

          {currentMenu === 'student_feedback' && <StudentFeedbackManagement />}

        </AdminLayout>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
