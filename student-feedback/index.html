<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学生端 - AI评审结果与反馈</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    .glass-effect {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes popIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .animate-slide-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    
    /* 问卷单选/多选样式优化 */
    .form-radio, .form-checkbox {
      accent-color: #6366f1; /* Indigo-500 */
    }
  </style>
</head>
<body class="bg-[#f5f7fa] text-slate-800 font-sans h-screen overflow-hidden selection:bg-indigo-200">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icons = {
      BookOpen: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>,
      CheckCircle: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>,
      ChevronDown: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><polyline points="6 9 12 15 18 9"/></svg>,
      ChevronUp: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><polyline points="18 15 12 9 6 15"/></svg>,
      ClipboardCheck: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14l2 2 4-4"/></svg>,
      ArrowLeft: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
      Edit3: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-3.5 h-3.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>,
      RefreshCw: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
      X: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>,
      Gift: () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-8 h-8"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
    };

    const SURVEY_QUESTIONS = [
      { id: 'q1', type: 'rating', text: '你觉得本次 AI 给出的等级和分数是否符合你的作业完成情况？', required: true },
      { id: 'q6', type: 'textarea', text: '如果你认为本次评审存在明显问题，请简单说明。', placeholder: '非必填，建议 200 字以内', required: false }
    ];

    const Sidebar = () => (
      <div className="w-72 bg-white border-r border-slate-200 h-full flex flex-col shrink-0 z-10">
        <div className="p-5 border-b border-slate-100 flex justify-between items-center">
          <span className="font-bold text-slate-800 text-sm">项目进度</span>
          <span className="font-bold text-slate-800 text-sm">6/6</span>
        </div>
        <div className="px-5 py-3">
          <div className="h-1.5 w-full bg-slate-100 rounded-full overflow-hidden">
            <div className="h-full bg-indigo-500 w-full rounded-full"></div>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto p-3 space-y-2 dark-scrollbar">
          <div className="flex items-center p-3 rounded-lg hover:bg-slate-50 cursor-pointer text-slate-700 font-medium text-sm">
            <div className="w-8 h-8 rounded bg-blue-500 text-white flex items-center justify-center mr-3"><Icons.BookOpen /></div>
            任务介绍
          </div>
          
          {/* 章节示例 1 */}
          <div className="border border-slate-100 rounded-lg overflow-hidden">
            <div className="flex items-center justify-between p-3 bg-slate-50 border-b border-slate-100 cursor-pointer">
              <div className="flex items-center text-sm font-bold text-slate-800">
                <div className="w-2 h-2 rounded-full bg-emerald-400 mr-3"></div>从品牌设计师到AI偶像...
              </div>
              <div className="flex items-center text-xs text-slate-400">共2课时 <Icons.ChevronDown /></div>
            </div>
            <div className="p-1">
              <div className="flex justify-between items-center p-2.5 text-sm hover:bg-slate-50 rounded cursor-pointer">
                <span className="text-slate-600 pl-5">课程资料</span>
                <span className="text-emerald-500 text-xs font-medium flex items-center"><Icons.CheckCircle /><span className="ml-1">已完成</span></span>
              </div>
              <div className="flex justify-between items-center p-2.5 text-sm hover:bg-slate-50 rounded cursor-pointer">
                <span className="text-slate-600 pl-5">课程视频</span>
                <span className="text-emerald-500 text-xs font-medium flex items-center"><Icons.CheckCircle /><span className="ml-1">已完成</span></span>
              </div>
            </div>
          </div>

          {/* 章节示例 2 */}
          <div className="border border-slate-100 rounded-lg overflow-hidden">
            <div className="flex items-center justify-between p-3 bg-slate-50 border-b border-slate-100 cursor-pointer">
              <div className="flex items-center text-sm font-bold text-slate-800">
                <div className="w-2 h-2 rounded-full bg-emerald-400 mr-3"></div>我创造了一个AI女孩...
              </div>
              <div className="flex items-center text-xs text-slate-400">共2课时 <Icons.ChevronDown /></div>
            </div>
          </div>

          {/* 章节示例 3 */}
          <div className="border border-slate-100 rounded-lg overflow-hidden">
            <div className="flex items-center justify-between p-3 bg-slate-50 border-b border-slate-100 cursor-pointer">
              <div className="flex items-center text-sm font-bold text-slate-800">
                <div className="w-2 h-2 rounded-full bg-emerald-400 mr-3"></div>商业运营与知识版权
              </div>
              <div className="flex items-center text-xs text-slate-400">共2课时 <Icons.ChevronDown /></div>
            </div>
          </div>

          {/* 当前高亮的评审结果 */}
          <div className="mt-4 p-3 rounded-lg bg-emerald-50 border border-emerald-100 flex items-center cursor-pointer">
             <div className="w-8 h-8 rounded bg-emerald-400 text-white flex items-center justify-center mr-3 shadow-sm"><Icons.ClipboardCheck /></div>
             <span className="font-bold text-emerald-600 text-sm">评审结果</span>
          </div>
        </div>
      </div>
    );

    const MainContent = ({ showInvite, showSurvey, showSuccess, handleAcceptInvite, handleDeclineInvite }) => (
      <div className="flex-1 flex flex-col h-full overflow-hidden bg-white relative">
        {/* 顶部通栏 */}
        <div className="h-16 border-b border-slate-100 flex items-center px-6 shrink-0 shadow-sm z-10 bg-white">
          <button className="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center text-slate-500 hover:bg-slate-50 mr-4">
            <Icons.ArrowLeft />
          </button>
          <div>
            <h1 className="font-bold text-slate-800 text-lg leading-tight">评审结果</h1>
            <div className="text-xs text-slate-500">项目评分</div>
          </div>
        </div>

        {/* 滚动内容区 */}
        <div className="flex-1 overflow-y-auto p-8 bg-[#fafbfc] flex justify-center pb-32">
          <div className="max-w-4xl w-full">
            
            {/* 重新评审按钮 */}
            <div className="flex justify-center mb-8">
              <button className="bg-[#6366f1] hover:bg-indigo-600 text-white px-6 py-2.5 rounded-full font-medium text-sm flex items-center shadow-md transition-transform hover:-translate-y-0.5">
                <Icons.RefreshCw /> <span className="ml-2">重新评审（当前剩余1次）</span>
              </button>
            </div>

            {/* 评审结果卡片 1 (未达标) */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm mb-6 overflow-hidden">
              <div className="p-5 flex items-start justify-between border-b border-slate-100">
                <div className="flex items-start max-w-2xl">
                  <div className="w-8 h-8 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-sm shrink-0 mr-4 mt-0.5">1</div>
                  <h3 className="text-[15px] font-medium text-slate-800 leading-relaxed pt-1">
                    课程视频&实战任务 - 请先生成一个属于你自己的原创数字人形象，并完成基础人设设定。
                  </h3>
                </div>
                <div className="flex items-center gap-3 shrink-0 pt-1">
                  <button className="flex items-center text-amber-500 text-sm font-medium hover:text-amber-600 border border-amber-200 px-3 py-1 rounded-md bg-amber-50">
                    <Icons.Edit3 /> <span className="ml-1">去修改</span>
                  </button>
                  <span className="text-red-500 text-sm font-bold bg-red-50 px-3 py-1 rounded-md border border-red-100">未达标</span>
                  <button className="flex items-center text-indigo-600 text-sm font-medium bg-indigo-50 px-3 py-1 rounded-md border border-indigo-100">
                    收起 <Icons.ChevronUp />
                  </button>
                </div>
              </div>
              
              <div className="p-6 space-y-4 bg-slate-50/50">
                {/* 优点 */}
                <div className="bg-[#ecfdf5] border border-[#a7f3d0] rounded-lg p-5">
                  <div className="flex items-center text-emerald-700 font-bold text-sm mb-2">
                    <div className="w-2 h-2 rounded-full bg-emerald-500 mr-2"></div>优点
                  </div>
                  <p className="text-emerald-900 text-sm leading-relaxed pl-4">已完成本题提交，具备继续完善的基础。</p>
                </div>
                {/* 缺点 */}
                <div className="bg-[#fffbeb] border border-[#fde68a] rounded-lg p-5">
                  <div className="flex items-center text-amber-700 font-bold text-sm mb-2">
                    <div className="w-2 h-2 rounded-full bg-amber-500 mr-2"></div>缺点
                  </div>
                  <p className="text-amber-900 text-sm leading-relaxed pl-4">当前提交内容缺少可核验的作业材料。</p>
                </div>
                {/* 改进意见 */}
                <div className="bg-[#eff6ff] border border-[#bfdbfe] rounded-lg p-5">
                  <div className="flex items-center text-blue-700 font-bold text-sm mb-2">
                    <div className="w-2 h-2 rounded-full bg-blue-500 mr-2"></div>改进意见
                  </div>
                  <p className="text-blue-900 text-sm leading-relaxed pl-4">请按题目要求补充可打开、可读取、可判断的作品文件或链接后重新提交。</p>
                </div>
              </div>
            </div>

            {/* 评审结果卡片 2 (达标) */}
            <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden opacity-75">
              <div className="p-5 flex items-center justify-between">
                <div className="flex items-center max-w-2xl">
                  <div className="w-8 h-8 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-sm shrink-0 mr-4">2</div>
                  <h3 className="text-[15px] font-medium text-slate-800 truncate">
                    课程视频&实战任务 - 请围绕原创数字人形象制作一支时长约1分钟的AIMV视频。
                  </h3>
                </div>
                <div className="flex items-center gap-3 shrink-0">
                  <span className="text-amber-600 text-sm font-bold bg-amber-50 px-3 py-1 rounded-md border border-amber-100">达标</span>
                  <button className="flex items-center text-indigo-600 text-sm font-medium bg-indigo-50 px-3 py-1 rounded-md border border-indigo-100">
                    详情 <Icons.ChevronDown />
                  </button>
                </div>
              </div>
            </div>

          </div>
        </div>

        {/* 交互流 1：底部邀请浮窗 (现在被移动到了 MainContent 内部，以便实现相对于右侧区域的居中) */}
        {showInvite && !showSurvey && !showSuccess && (
          <FeedbackInviteOverlay 
            onAccept={handleAcceptInvite} 
            onDecline={handleDeclineInvite} 
          />
        )}
      </div>
    );

    const FeedbackInviteOverlay = ({ onAccept, onDecline }) => (
      <div className="absolute bottom-6 w-full z-30 animate-slide-up flex justify-center pointer-events-none px-4">
        <div className="glass-effect bg-white/95 border border-slate-100 shadow-[0_8px_30px_rgba(0,0,0,0.08)] rounded-xl p-3 sm:p-4 flex flex-col sm:flex-row items-center gap-3 sm:gap-5 max-w-3xl mx-auto pointer-events-auto">
          {/* 左侧头像 */}
          <div className="w-11 h-11 bg-gradient-to-tr from-indigo-500 via-purple-500 to-indigo-400 rounded-full flex items-center justify-center text-2xl shadow-inner shrink-0">
            🤖
          </div>
          
          {/* 中间文本 */}
          <div className="flex-1 text-center sm:text-left">
            <h4 className="font-bold text-slate-800 text-[14px] mb-1 flex items-center justify-center sm:justify-start">
              Hi 同学！AI 老师刚刚为您批改完作业啦 👋
            </h4>
            <p className="text-[12px] text-slate-600 leading-snug">
              想听听您的真实想法，测测我的「智商」和「情商」在线吗？填个 1 分钟的
              小问卷，即可掉落 <span className="font-bold text-amber-500">10 个积分奖励</span> 哦！ 🎁
            </p>
          </div>
          
          {/* 右侧按钮 */}
          <div className="flex flex-row sm:flex-col gap-2 shrink-0 w-full sm:w-auto">
            <button onClick={onAccept} className="flex-1 sm:flex-none bg-[#5c4fff] hover:bg-indigo-600 text-white font-bold py-2 px-5 rounded-lg shadow-[0_4px_12px_rgba(92,79,255,0.3)] transition-transform hover:-translate-y-0.5 active:translate-y-0 text-xs flex items-center justify-center whitespace-nowrap">
              🚀 去吐槽 / 点赞
            </button>
            <button onClick={onDecline} className="flex-1 sm:flex-none bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 font-medium py-2 px-5 rounded-lg transition-colors text-xs flex items-center justify-center whitespace-nowrap">
              👀 继续查看结果
            </button>
          </div>
        </div>
      </div>
    );

    const SurveyModal = ({ onClose, onSuccess }) => {
      const [answers, setAnswers] = useState({});
      const [errors, setErrors] = useState({});
      const [hoverRating, setHoverRating] = useState(0);

      const handleRadioChange = (qId, value) => {
        setAnswers(prev => ({ ...prev, [qId]: value }));
        if (errors[qId]) setErrors(prev => ({ ...prev, [qId]: null }));
      };

      const handleCheckboxChange = (qId, value) => {
        setAnswers(prev => {
          const currentArr = prev[qId] || [];
          const newArr = currentArr.includes(value) 
            ? currentArr.filter(v => v !== value) 
            : [...currentArr, value];
          return { ...prev, [qId]: newArr };
        });
        if (errors[qId]) setErrors(prev => ({ ...prev, [qId]: null }));
      };

      const handleTextChange = (qId, value) => {
        setAnswers(prev => ({ ...prev, [qId]: value }));
      };

      const handleSubmit = () => {
        const newErrors = {};
        SURVEY_QUESTIONS.forEach(q => {
          if (q.required) {
            if ((q.type === 'radio' || q.type === 'rating') && !answers[q.id]) {
              newErrors[q.id] = q.type === 'rating' ? '请选择评分' : '请选择一个选项';
            } else if (q.type === 'checkbox' && (!answers[q.id] || answers[q.id].length === 0)) {
              newErrors[q.id] = '请至少选择一项';
            }
          }
        });

        if (Object.keys(newErrors).length > 0) {
          setErrors(newErrors);
          // 滚动到第一个错误处 (简单处理)
          const firstErrorId = Object.keys(newErrors)[0];
          document.getElementById(`question-${firstErrorId}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          // 校验通过
          onSuccess();
        }
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
          {/* 背景虚化层 */}
          <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm animate-fade-in" onClick={onClose}></div>
          
          {/* 弹窗主体 */}
          <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] flex flex-col relative z-10 animate-pop-in overflow-hidden">
            
            {/* 顶部 Header */}
            <div className="px-8 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50 shrink-0">
              <div className="flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center">📋</div>
                <div>
                  <h2 className="font-bold text-slate-800 text-lg">AI 评审体验反馈问卷</h2>
                  <p className="text-xs text-slate-500 mt-0.5">您的宝贵意见将帮助我们不断优化 AI 评审引擎</p>
                </div>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded-full hover:bg-slate-200 flex items-center justify-center text-slate-400 transition-colors">
                <Icons.X />
              </button>
            </div>

            {/* 滚动表单区 */}
            <div className="flex-1 overflow-y-auto p-8 bg-white dark-scrollbar space-y-8">
              {SURVEY_QUESTIONS.map((q, index) => (
                <div key={q.id} id={`question-${q.id}`} className={`p-5 rounded-xl border ${errors[q.id] ? 'border-red-300 bg-red-50' : 'border-slate-100 bg-white'}`}>
                  <div className="flex items-start mb-4">
                    <span className="font-bold text-indigo-500 mr-2">{index + 1}.</span>
                    <h3 className="font-bold text-slate-800 text-[15px]">
                      {q.text}
                      {q.required && <span className="text-red-500 ml-1">*</span>}
                    </h3>
                  </div>

                  {/* 单选渲染 */}
                  {q.type === 'radio' && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pl-6">
                      {q.options.map(opt => (
                        <label key={opt} className="flex items-center cursor-pointer p-3 rounded-lg border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/30 transition-colors">
                          <input type="radio" name={q.id} value={opt} onChange={() => handleRadioChange(q.id, opt)} checked={answers[q.id] === opt} className="form-radio h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300" />
                          <span className="ml-3 text-sm text-slate-700">{opt}</span>
                        </label>
                      ))}
                    </div>
                  )}

                  {/* 五星评分渲染 */}
                  {q.type === 'rating' && (
                    <div className="pl-6">
                      <div className="inline-flex items-center gap-2" onMouseLeave={() => setHoverRating(0)}>
                        {[1, 2, 3, 4, 5].map(star => {
                          const active = star <= (hoverRating || answers[q.id] || 0);
                          return (
                            <button
                              key={star}
                              type="button"
                              onMouseEnter={() => setHoverRating(star)}
                              onClick={() => handleRadioChange(q.id, star)}
                              className={`text-4xl leading-none transition-all hover:scale-110 ${active ? 'text-amber-400' : 'text-slate-200 hover:text-amber-300'}`}
                              aria-label={`${star} 星`}
                            >★</button>
                          );
                        })}
                        <span className="ml-3 text-sm font-bold text-slate-600">{answers[q.id] ? `${answers[q.id]} 星` : '请选择'}</span>
                      </div>
                      <div className="flex justify-between w-[232px] mt-2 text-xs text-slate-400">
                        <span>非常不符合</span><span>非常符合</span>
                      </div>
                    </div>
                  )}

                  {/* 多选渲染 */}
                  {q.type === 'checkbox' && (
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pl-6">
                      {q.options.map(opt => (
                        <label key={opt} className="flex items-center cursor-pointer p-3 rounded-lg border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/30 transition-colors">
                          <input type="checkbox" value={opt} onChange={() => handleCheckboxChange(q.id, opt)} checked={(answers[q.id] || []).includes(opt)} className="form-checkbox h-4 w-4 text-indigo-600 rounded focus:ring-indigo-500 border-gray-300" />
                          <span className="ml-3 text-sm text-slate-700">{opt}</span>
                        </label>
                      ))}
                    </div>
                  )}

                  {/* 文本渲染 */}
                  {q.type === 'textarea' && (
                    <div className="pl-6">
                      <textarea 
                        className="w-full border border-slate-300 rounded-lg p-3 text-sm text-slate-700 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 resize-none" 
                        rows="4" 
                        placeholder={q.placeholder}
                        value={answers[q.id] || ''}
                        onChange={(e) => handleTextChange(q.id, e.target.value)}
                      ></textarea>
                    </div>
                  )}

                  {/* 错误提示 */}
                  {errors[q.id] && (
                    <div className="pl-6 mt-2 text-sm text-red-500 flex items-center">
                      <Icons.X className="w-4 h-4 mr-1" /> {errors[q.id]}
                    </div>
                  )}
                </div>
              ))}
            </div>

            {/* 底部操作区 */}
            <div className="p-5 border-t border-slate-100 bg-slate-50 flex justify-end shrink-0">
               <button onClick={handleSubmit} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-10 rounded-xl shadow-md transition-transform hover:-translate-y-0.5 active:translate-y-0 text-sm">
                 提交问卷
               </button>
            </div>
          </div>
        </div>
      );
    };

    const SuccessModal = ({ onClose }) => (
      <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
        <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm animate-fade-in" onClick={onClose}></div>
        <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-sm w-full text-center relative z-10 animate-pop-in">
          <div className="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-5 text-amber-500 relative">
            <Icons.Gift />
            <div className="absolute -top-1 -right-1 w-6 h-6 bg-red-500 text-white text-xs font-bold rounded-full flex items-center justify-center border-2 border-white">+10</div>
          </div>
          <h2 className="text-2xl font-extrabold text-slate-800 mb-2">感谢您的反馈！</h2>
          <p className="text-slate-600 text-sm mb-8 leading-relaxed">
            您的声音是我们前进的动力，AI 老师会努力变得更好～<br/>
            已为您发放 <span className="font-bold text-amber-500">10 积分</span> 奖励。
          </p>
          <button onClick={onClose} className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl transition-colors">
            返回查看评审结果
          </button>
        </div>
      </div>
    );

    function App() {
      // 状态管理
      const [showInvite, setShowInvite] = useState(true);
      const [showSurvey, setShowSurvey] = useState(false);
      const [showSuccess, setShowSuccess] = useState(false);

      const handleAcceptInvite = () => {
        setShowInvite(false);
        setShowSurvey(true);
      };

      const handleDeclineInvite = () => {
        setShowInvite(false);
      };

      const handleSurveySuccess = () => {
        setShowSurvey(false);
        setShowSuccess(true);
      };

      const handleCloseSuccess = () => {
        setShowSuccess(false);
      };

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-[#f5f7fa] relative">
          {/* 底层背景：完美的参考图还原 */}
          <Sidebar />
          {/* MainContent 现在接收状态和回调作为 props，以便在内部渲染悬浮窗 */}
          <MainContent 
            showInvite={showInvite}
            showSurvey={showSurvey}
            showSuccess={showSuccess}
            handleAcceptInvite={handleAcceptInvite}
            handleDeclineInvite={handleDeclineInvite}
          />

          {/* 交互流 2：问卷填写弹窗 */}
          {showSurvey && (
            <SurveyModal 
              onClose={() => { setShowSurvey(false); setShowInvite(true); }} 
              onSuccess={handleSurveySuccess} 
            />
          )}

          {/* 交互流 3：成功奖励弹窗 */}
          {showSuccess && (
            <SuccessModal onClose={handleCloseSuccess} />
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
