<!DOCTYPE html>
<!--
  文件说明：AI 评审团优化流程交互演示页。
  作用：以可点击流程图展示 Agent 评审团优化后的完整数据流。
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI评审团流程交互图</title>
  <style>
    :root {
      --bg: #f3f6fb;
      --ink: #172033;
      --muted: #667085;
      --line: #9aa8c7;
      --agent: #5b5ce2;
      --skill: #0ea5a4;
      --tool: #e87a2f;
      --service: #3b82f6;
      --action: #64748b;
      --fail: #ef4444;
      --ok: #16a34a;
      --panel: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top left, #eef2ff, transparent 34%), var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .page {
      width: min(1740px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 22px 0 34px;
    }

    .hero {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 16px;
    }

    .hero h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.2;
    }

    .hero p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.75;
      max-width: 980px;
      font-size: 14px;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a {
      color: #344054;
      background: #fff;
      border: 1px solid #d9e0ef;
      border-radius: 999px;
      padding: 9px 12px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(1120px, 1fr) 440px;
      gap: 16px;
      align-items: start;
    }

    .canvas-wrap {
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid #d9e0ef;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(23, 32, 51, 0.1);
      overflow: auto;
      padding: 18px;
    }

    .flow-canvas {
      position: relative;
      width: 1260px;
      height: 2280px;
      margin: 0 auto;
      background:
        linear-gradient(#eef2f8 1px, transparent 1px),
        linear-gradient(90deg, #eef2f8 1px, transparent 1px);
      background-size: 32px 32px;
      border-radius: 22px;
    }

    .stage-zone {
      position: absolute;
      border: 1px dashed #d6deef;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.42);
      pointer-events: none;
    }

    .stage-title {
      position: absolute;
      top: 12px;
      left: 18px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #fff;
      color: #667085;
      font-size: 12px;
      font-weight: 900;
      border: 1px solid #d9e0ef;
      z-index: 7;
    }

    .stage-admin { left: 18px; top: 36px; width: 1224px; height: 290px; }
    .stage-config { left: 18px; top: 360px; width: 1224px; height: 250px; }
    .stage-submit { left: 18px; top: 645px; width: 1224px; height: 250px; }
    .stage-evidence { left: 18px; top: 930px; width: 1224px; height: 630px; }
    .stage-result { left: 18px; top: 1595px; width: 1224px; height: 640px; }

    .flow-line {
      position: absolute;
      inset: 0;
      width: 1260px;
      height: 2280px;
      pointer-events: none;
      z-index: 1;
    }

    .flow-line path,
    .flow-line line,
    .flow-line polyline {
      fill: none;
      stroke: var(--line);
      stroke-width: 2.2;
      marker-end: url(#arrowDefault);
    }

    .flow-line .ok-path {
      stroke: var(--ok);
      stroke-width: 2.8;
      marker-end: url(#arrowOk);
    }

    .flow-line .fail-path {
      stroke: var(--fail);
      stroke-width: 2.8;
      stroke-dasharray: 7 6;
      marker-end: url(#arrowFail);
    }

    .flow-line .data-path {
      stroke: #7c3aed;
      stroke-width: 2.6;
      stroke-dasharray: 4 5;
      marker-end: url(#arrowData);
    }

    .flow-line .no-arrow {
      marker-end: none;
    }

    .path-label {
      position: absolute;
      padding: 5px 8px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #d9e0ef;
      color: #475467;
      font-size: 11px;
      font-weight: 900;
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 8px 18px rgba(23, 32, 51, 0.08);
      z-index: 6;
    }

    .flow-node {
      position: absolute;
      z-index: 3;
      width: 200px;
      min-height: 86px;
      border: 2px solid #d7deef;
      background: var(--panel);
      border-radius: 16px;
      padding: 12px 13px;
      text-align: left;
      cursor: pointer;
      color: var(--ink);
      box-shadow: 0 12px 26px rgba(23, 32, 51, 0.08);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .flow-node:hover,
    .flow-node.active {
      transform: translateY(-2px);
      box-shadow: 0 20px 38px rgba(23, 32, 51, 0.15);
      border-color: #5b5ce2;
    }

    .flow-node.active {
      outline: 4px solid rgba(91, 92, 226, 0.12);
    }

    .flow-node h3 {
      margin: 7px 0 6px;
      font-size: 15px;
      line-height: 1.36;
    }

    .flow-node p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 900;
      color: #fff;
    }

    .flow-node.action { border-color: #cbd5e1; }
    .flow-node.action .tag { background: var(--action); }
    .flow-node.agent { border-color: #c7d2fe; }
    .flow-node.agent .tag { background: var(--agent); }
    .flow-node.skill { border-color: #99f6e4; }
    .flow-node.skill .tag { background: var(--skill); }
    .flow-node.tool { width: 120px; min-height: 64px; border-color: #fed7aa; border-radius: 14px; padding: 9px 10px; }
    .flow-node.tool .tag { background: var(--tool); }
    .flow-node.service { border-color: #bfdbfe; }
    .flow-node.service .tag { background: var(--service); }
    .flow-node.fail { border-color: #fecaca; background: #fff7f7; }
    .flow-node.fail .tag { background: var(--fail); }
    .flow-node.result { border-color: #bbf7d0; background: #f7fff9; }
    .flow-node.result .tag { background: var(--ok); }

    .detail-panel {
      position: sticky;
      top: 18px;
      max-height: calc(100vh - 36px);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid #d9e0ef;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(23, 32, 51, 0.12);
    }

    .detail-head {
      padding: 18px;
      border-bottom: 1px solid #e7ecf5;
      background: linear-gradient(135deg, #ffffff, #f3f6ff);
    }

    .detail-type {
      display: inline-flex;
      border-radius: 999px;
      padding: 5px 9px;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 12px;
      font-weight: 900;
    }

    .detail-head h2 {
      margin: 10px 0 7px;
      font-size: 22px;
      line-height: 1.3;
    }

    .detail-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .detail-body {
      overflow: auto;
      padding: 16px;
      display: grid;
      gap: 12px;
    }

    .info-block {
      border: 1px solid #e5eaf4;
      border-radius: 16px;
      background: #fff;
      padding: 13px;
    }

    .info-block h3 {
      margin: 0 0 9px;
      font-size: 14px;
    }

    .info-block p,
    .info-block li {
      color: #5f6f89;
      font-size: 12px;
      line-height: 1.72;
    }

    .info-block ul {
      margin: 0;
      padding-left: 18px;
    }

    .json-box {
      margin: 0;
      border-radius: 14px;
      background: #111827;
      color: #dbeafe;
      padding: 12px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      line-height: 1.62;
      max-height: 360px;
      overflow: auto;
    }

    @media (max-width: 1200px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .detail-panel {
        position: static;
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero">
      <div>
        <h1>Agent 评审团优化流程交互图</h1>
        <p>点击任意模块查看该模块的真实输入、输出、数据传递方向和执行规则。虚线紫色表示证据数据流，绿色表示门槛通过路径，红色虚线表示门槛不合格直接输出结果路径。</p>
      </div>
    </header>

    <section class="layout">
      <div class="canvas-wrap">
        <div class="flow-canvas">
          <div class="stage-zone stage-admin"><span class="stage-title">一、管理端配置</span></div>
          <div class="stage-zone stage-config"><span class="stage-title">二、评审流程配置</span></div>
          <div class="stage-zone stage-submit"><span class="stage-title">三、学生提交与门槛判断</span></div>
          <div class="stage-zone stage-evidence"><span class="stage-title">四、Skill / Tool 并行取证</span></div>
          <div class="stage-zone stage-result"><span class="stage-title">五、结果生成</span></div>

          <svg class="flow-line" viewBox="0 0 1260 2280" aria-hidden="true">
            <defs>
              <marker id="arrowDefault" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8.2" refY="5" orient="auto" markerUnits="userSpaceOnUse">
                <path d="M1,1 L9,5 L1,9 Z" fill="#9aa8c7"></path>
              </marker>
              <marker id="arrowOk" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8.2" refY="5" orient="auto" markerUnits="userSpaceOnUse">
                <path d="M1,1 L9,5 L1,9 Z" fill="#16a34a"></path>
              </marker>
              <marker id="arrowFail" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8.2" refY="5" orient="auto" markerUnits="userSpaceOnUse">
                <path d="M1,1 L9,5 L1,9 Z" fill="#ef4444"></path>
              </marker>
              <marker id="arrowData" viewBox="0 0 10 10" markerWidth="9" markerHeight="9" refX="8.2" refY="5" orient="auto" markerUnits="userSpaceOnUse">
                <path d="M1,1 L9,5 L1,9 Z" fill="#7c3aed"></path>
              </marker>
            </defs>
            <line x1="240" y1="163" x2="272" y2="163"></line>
            <line x1="480" y1="163" x2="512" y2="163"></line>
            <line x1="720" y1="163" x2="752" y2="163"></line>
            <line x1="960" y1="163" x2="992" y2="163"></line>
            <path d="M1100 206 V335 H480 V413"></path>
            <line x1="580" y1="473" x2="672" y2="473"></line>
            <path d="M780 516 V630 H480 V713"></path>
            <line x1="580" y1="773" x2="672" y2="773"></line>
            <path class="fail-path" d="M880 773 H952"></path>
            <path class="ok-path no-arrow" d="M780 828 V940"></path>
            <path class="ok-path no-arrow" d="M240 940 H1020"></path>
            <path class="ok-path" d="M240 940 V1032"></path>
            <path class="ok-path" d="M630 940 V1032"></path>
            <path class="ok-path" d="M1020 940 V1032"></path>
            <line x1="240" y1="1126" x2="240" y2="1182"></line>
            <line x1="630" y1="1126" x2="630" y2="1182"></line>
            <line x1="1020" y1="1126" x2="1020" y2="1182"></line>
            <path class="data-path no-arrow" d="M340 1083 H400 V900"></path>
            <path class="data-path no-arrow" d="M730 1083 H650 V900"></path>
            <path class="data-path no-arrow" d="M920 1083 H860 V900"></path>
            <path class="data-path no-arrow" d="M400 900 H860"></path>
            <path class="data-path" d="M650 900 V850 H720 V840"></path>
            <path d="M820 828 V1545 H630 V1643"></path>
            <line x1="630" y1="1744" x2="630" y2="1807"></line>
            <line x1="630" y1="1904" x2="630" y2="1967"></line>
          </svg>

          <span class="path-label" style="left: 474px; top: 332px;">全部保存后触发</span>
          <span class="path-label" style="left: 692px; top: 924px; color: var(--ok);">门槛通过，分成 3 个 Skill 分支</span>
          <span class="path-label" style="left: 884px; top: 736px; color: var(--fail);">门槛不合格</span>
          <span class="path-label" style="left: 420px; top: 872px; color: #7c3aed;">3 个 Skill 结果合并后返回 Agent</span>

          <button class="flow-node action active" style="left:40px; top:120px;" data-node="admin-select">
            <span class="tag">用户操作</span>
            <h3>管理员选择题目</h3>
            <p>在题库选择需要生成评价指标的题目。</p>
          </button>
          <button class="flow-node action" style="left:280px; top:120px;" data-node="metric-click">
            <span class="tag">用户操作</span>
            <h3>点击生成评价指标</h3>
            <p>触发评价指标生成 Agent。</p>
          </button>
          <button class="flow-node agent" style="left:520px; top:120px;" data-node="metric-agent">
            <span class="tag">Agent</span>
            <h3>评价指标生成 Agent</h3>
            <p>生成题目类型、展示指标、详细评审指标。</p>
          </button>
          <button class="flow-node action" style="left:760px; top:120px;" data-node="admin-edit">
            <span class="tag">用户操作</span>
            <h3>管理员修改指标</h3>
            <p>修改题目类型、指标、门槛项和标准。</p>
          </button>
          <button class="flow-node action" style="left:1000px; top:120px;" data-node="save-metric">
            <span class="tag">用户操作</span>
            <h3>点击全部保存</h3>
            <p>保存指标，并触发 Skill 计划生成。</p>
          </button>

          <button class="flow-node agent" style="left:380px; top:430px;" data-node="skill-plan-agent">
            <span class="tag">Agent</span>
            <h3>评审 Skill 确定 Agent</h3>
            <p>为本题固定 Skill 调用计划。</p>
          </button>
          <button class="flow-node service" style="left:680px; top:430px;" data-node="save-config">
            <span class="tag">后端服务</span>
            <h3>保存评审流程配置</h3>
            <p>保存指标版本、Skill 计划和 Prompt 版本。</p>
          </button>
          <button class="flow-node action" style="left:380px; top:730px;" data-node="student-submit">
            <span class="tag">用户操作</span>
            <h3>学生提交作业</h3>
            <p>提交 URL、README、代码包等材料。</p>
          </button>
          <button class="flow-node agent" style="left:680px; top:730px;" data-node="gate-agent">
            <span class="tag">Agent</span>
            <h3>门槛项评审与证据获取 Agent</h3>
            <p>先判定门槛，决定是否进入 Skill 取证。</p>
          </button>

          <button class="flow-node fail" style="left:960px; top:730px;" data-node="gate-fail-result">
            <span class="tag">失败分支</span>
            <h3>直接输出不合格结果</h3>
            <p>不调用 Skill，不进入单题正式评分。</p>
          </button>

          <button class="flow-node skill" style="left:140px; top:1040px;" data-node="web-skill">
            <span class="tag">Skill</span>
            <h3>网页访问 Skill</h3>
            <p>获取 URL、截图、交互路径证据。</p>
          </button>
          <button class="flow-node tool" style="left:180px; top:1190px;" data-node="web-tools">
            <span class="tag">Tool</span>
            <h3>网页 Tool</h3>
            <p>URL校验、截图、页面交互。</p>
          </button>

          <button class="flow-node skill" style="left:530px; top:1040px;" data-node="doc-skill">
            <span class="tag">Skill</span>
            <h3>文档读取 Skill</h3>
            <p>读取 README、Markdown、PDF、Word。</p>
          </button>
          <button class="flow-node tool" style="left:570px; top:1190px;" data-node="doc-tools">
            <span class="tag">Tool</span>
            <h3>文档 Tool</h3>
            <p>解析文本、表格和引用位置。</p>
          </button>

          <button class="flow-node skill" style="left:920px; top:1040px;" data-node="code-skill">
            <span class="tag">Skill</span>
            <h3>代码/压缩包 Skill</h3>
            <p>读取压缩包、文件树、入口文件。</p>
          </button>
          <button class="flow-node tool" style="left:960px; top:1190px;" data-node="code-tools">
            <span class="tag">Tool</span>
            <h3>代码 Tool</h3>
            <p>解压、读文件、沙箱运行。</p>
          </button>

          <button class="flow-node agent" style="left:530px; top:1655px;" data-node="single-review-agent">
            <span class="tag">Agent</span>
            <h3>单题评审 Agent</h3>
            <p>基于证据包评分并输出题目结果。</p>
          </button>
          <button class="flow-node agent" style="left:530px; top:1815px;" data-node="course-review-agent">
            <span class="tag">Agent</span>
            <h3>课程评审 Agent</h3>
            <p>汇总各题结构化结果生成项目评价。</p>
          </button>
          <button class="flow-node result" style="left:530px; top:1975px;" data-node="result-page">
            <span class="tag">结果展示</span>
            <h3>评审结果页</h3>
            <p>展示单题结果、课程综合评价和失败分支结果。</p>
          </button>
        </div>
      </div>

      <aside class="detail-panel">
        <div class="detail-head">
          <span class="detail-type" id="detailType">用户操作</span>
          <h2 id="detailTitle">管理员选择题目</h2>
          <p id="detailDesc">在题库选择需要生成评价指标的题目。</p>
        </div>
        <div class="detail-body" id="detailBody"></div>
      </aside>
    </section>
  </main>

  <script>
    const details = {
      "admin-select": {
        type: "用户操作",
        title: "管理员选择题目",
        desc: "管理员在题库中选择一个或多个需要生成评价指标的题目。",
        overview: [
          "进入题库的“生成评价指标”页面。",

      "metric-click": {

        title: "点击生成评价指标",
        desc: "管理员点击按钮后，系统把题目信息传给评价指标生成 Agent。",
        overview: [
          "点击页面右侧或底部的“生成评价指标”按钮。",
          "页面进入生成中状态，右侧展示 Agent 执行进度。",
          "等待生成完成后，进入评价指标编辑页面。"
        ],
        input: {
          "选中题目": "q_coding_web_001"
        },
        output: {
          "调用方法": "generateQuestionRubric(questionId, questionContent, submitRequirements)",
          "传入评价指标生成Agent": ["题目编号", "题目内容", "提交文件要求"]
        },
        passTo: "系统自动调用评价指标生成 Agent，管理员等待生成结果。"
      },
      "metric-agent": {
        type: "Agent",
        title: "评价指标生成 Agent",
        desc: "生成题目类型、学生展示指标、Agent 评审指标、门槛项、不合格规则和建议 Skill。",
        overview: [
          "输入没有题目类型候选，只读取题目编号、题目内容、提交文件要求。",
          "学生展示指标只生成一条，100字以内，是 Agent 评审指标的简要总结。",
          "Agent 评审指标按“评审维度 > 评审指标”生成，每条指标都有分值、合格要求、优秀要求、不合格判定和证据要求。"
        ],

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderList(items) {
      return `<ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>`;
    }

    function renderJson(value) {
      return `<pre class="json-box">${escapeHtml(JSON.stringify(value, null, 2))}</pre>`;
    }

    function renderDetail(key) {
      const data = details[key];
      if (!data) return;
      document.querySelectorAll(".flow-node").forEach((node) => {
        node.classList.toggle("active", node.dataset.node === key);
      });
      document.getElementById("detailType").textContent = data.type;
      document.getElementById("detailTitle").textContent = data.title;
      document.getElementById("detailDesc").textContent = data.desc;
      const isUserAction = data.type === "用户操作";
      document.getElementById("detailBody").innerHTML = isUserAction
        ? `
          <section class="info-block">
            <h3>操作步骤</h3>
            ${renderList(data.overview)}
          </section>
          <section class="info-block">
            <h3>下一步</h3>
            <p>${escapeHtml(data.passTo)}</p>
          </section>
        `
        : `
          <section class="info-block">
            <h3>模块说明</h3>
            ${renderList(data.overview)}
          </section>
          <section class="info-block">
            <h3>输入</h3>
            ${renderJson(data.input)}
          </section>
          <section class="info-block">
            <h3>输出</h3>
            ${renderJson(data.output)}
          </section>
          <section class="info-block">
            <h3>数据传递</h3>
            <p>${escapeHtml(data.passTo)}</p>
          </section>
        `;
    }

    document.querySelectorAll(".flow-node").forEach((node) => {
      node.addEventListener("click", () => renderDetail(node.dataset.node));
    });

    renderDetail("admin-select");
  </script>
