          return bank.questions.some(q =>

    // --- 组件 1：配置评价标准页面 (题库子流程) ---
    const Step1ConfigRubrics = ({ task, onComplete, onExit }) => {
      const [qIdx, setQIdx] = useState(0);
      const currentQuestion = task.questions[qIdx];
      
      const [formData, setFormData] = useState([]);

      useEffect(() => {
        if (currentQuestion) {
          // 初始化现有指标，或者提供一个空模板
          setFormData(currentQuestion.rubrics && currentQuestion.rubrics.length > 0 
            ? JSON.parse(JSON.stringify(currentQuestion.rubrics)) 
            : [{ dimension: "默认评价维度", score: '', passStandard: "", failStandard: "", excellentStandard: "", evidence: [] }]);
        }
      }, [currentQuestion]);

      const handleFieldChange = (idx, field, value) => {
        const newData = [...formData];
        newData[idx][field] = value;
        setFormData(newData);
      };

      const addDimension = () => {
        setFormData([...formData, { dimension: "新增维度", score: '', passStandard: "", failStandard: "", excellentStandard: "", evidence: [] }]);
      };
      
      const removeDimension = (idx) => {
        if(formData.length > 1) {
           const newData = [...formData];
           newData.splice(idx, 1);
           setFormData(newData);
        }
      };

      if (!currentQuestion) return null;

      const currentTotalScore = formData.reduce((sum, item) => sum + (Number(item.score) || 0), 0);
      const hasZeroScore = formData.some(item => !item.score || Number(item.score) <= 0);
      const isAllFilled = formData.every(item => item.passStandard && item.failStandard && item.excellentStandard && item.dimension);
      const canProceed = currentTotalScore === 100 && !hasZeroScore && isAllFilled;
      const isLast = qIdx === task.questions.length - 1;

      const handleNext = () => {
        if (!canProceed) return;
        // 模拟保存逻辑
        if (isLast) {
          onComplete(task.id);
        } else {
          setQIdx(qIdx + 1);
        }
      };

      return (
        <div className="absolute inset-0 flex flex-col bg-slate-50 z-30">
          {/* Header */}
          <div className="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center shrink-0 shadow-sm">

              </span>
              <span className="text-[13px] text-slate-500 border-l border-slate-200 pl-4">{task.name}</span>
            </div>
            <button onClick={onExit} className="text-slate-500 hover:text-slate-700 text-[13px] flex items-center font-medium transition-colors">
              <Icons.ArrowLeft /> <span className="ml-1">返回题库</span>
            </button>
          </div>

          {/* Progress */}
          <div className="bg-white border-b border-slate-200 px-6 py-2.5 flex items-center justify-center gap-3 shrink-0">
            <span className="text-[12px] text-slate-500 font-bold mr-2">配置进度：</span>
            {task.questions.map((q, i) => (
              <div key={i} className="flex items-center">
                <div className={`flex items-center justify-center w-7 h-7 text-[12px] font-bold rounded-full transition-colors ${i < qIdx ? 'bg-emerald-100 text-emerald-700' : i === qIdx ? 'bg-[#3b82f6] text-white shadow-md' : 'bg-slate-100 text-slate-400'}`}>
                  {i+1}
                </div>
                {i < task.questions.length - 1 && <div className="w-5 border-t-2 border-slate-200 mx-1.5"></div>}
              </div>
            ))}
          </div>

          {/* Main Area */}
          <div className="flex-1 overflow-y-auto p-6 flex flex-col items-center">
            <div className="w-full max-w-[1200px] bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
               <div className="p-6 border-b border-slate-100 bg-slate-50">
                 <div className="flex items-center mb-3">
                    <h2 className="text-[16px] font-bold text-slate-800 tracking-tight">{currentQuestion.title}</h2>
                    <span className="px-2 py-0.5 bg-blue-50 text-[#3b82f6] text-[11px] font-bold rounded border border-blue-100 ml-3">{currentQuestion.typeName}题</span>
                 </div>
                 {currentQuestion.requirement && (
                    <div className="text-[13px] text-slate-600 bg-white p-4 rounded-lg border border-slate-200 leading-relaxed shadow-sm">
                      <span className="font-bold text-slate-800">题目要求：</span>{currentQuestion.requirement}
                    </div>
                 )}
               </div>

               {/* Table */}
               <div className="p-0 overflow-x-auto">
                 <table className="w-full text-left text-[13px] min-w-[1000px]">
                   <thead className="bg-[#f8fafc] text-slate-600 border-b border-slate-200">
                     <tr>
                       <th className="px-4 py-3 font-bold w-[15%]">评分指标名称</th>
                       <th className="px-4 py-3 font-bold w-[10%]">分值权重</th>
                       <th className="px-4 py-3 font-bold w-[22%] text-red-700">未达标条件 [Fail]</th>
                       <th className="px-4 py-3 font-bold w-[22%] text-blue-700">达标要求 [Pass]</th>
                       <th className="px-4 py-3 font-bold w-[22%] text-emerald-700">优秀要求 [Excellent]</th>
                       <th className="px-4 py-3 font-bold w-[9%] text-center">操作</th>
                     </tr>
                   </thead>
                   <tbody className="divide-y divide-slate-100">
                     {formData.map((rubric, idx) => (
                       <tr key={idx} className="bg-white">
                         <td className="px-4 py-4 align-top">
                           <input type="text" value={rubric.dimension} onChange={e => handleFieldChange(idx, 'dimension', e.target.value)} className="w-full border border-slate-300 rounded px-2.5 py-2 text-[13px] outline-none focus:border-blue-500 font-bold text-slate-700" placeholder="如：代码完整性" />
                         </td>
                         <td className="px-4 py-4 align-top">
                           <input type="number" min="1" value={rubric.score} onChange={e => {

          </div>

    };

    // --- 组件 2：作业盲审页面 ---

                       {/* 题目要求展示区 */}

                       </div>

                       {/* 学生答案多媒体渲染区 */}

                  <Icons.CheckSquare /> <span className="ml-2">{!isTaskOverall ? '结构化批阅单' : '任务综合评价表单'}</span>
               </div>
               
               <div className="flex-1 overflow-y-auto p-6">

    // --- 主应用入口 ---
    function App() {
      const [tasks, setTasks] = useState(INITIAL_TASKS);
      const [questionBanks, setQuestionBanks] = useState(INITIAL_QUESTION_BANKS);
      const [currentView, setCurrentView] = useState('dashboard'); // 默认展示首页
      const [selectedTask, setSelectedTask] = useState(null); // 用于评审或指标配置的任务载体
      
      // 题库弹窗状态
      const [generatingBank, setGeneratingBank] = useState(null);

      const handleAction = (task, type) => {
        setSelectedTask(task);
        if (type === 'review') setCurrentView('action-review');
      };

      // 从题库发起生成指标流程
      const handleGenerateConfig = (selectedIds) => {
        // 构建用于配置的 payload
        const bankToConfig = {
          ...generatingBank,
          id: generatingBank.id,
          name: generatingBank.name,
          questions: generatingBank.questions.filter(q => selectedIds.includes(q.id)).map(q => ({
              ...q,
              rubrics: q.rubrics || [
                { dimension: "维度1", score: '', passStandard: "", failStandard: "", excellentStandard: "", evidence: [] }
              ]
          }))
        };
        setSelectedTask(bankToConfig);
        setGeneratingBank(null);
        setCurrentView('action-config');
      };

      const handleConfigComplete = (taskId) => {
        // 配置完成后返回题库列表
        setCurrentView('questionBank');
      };

      return (
        <Layout currentMenu={currentView} setCurrentMenu={setCurrentView}>
          {currentView === 'dashboard' && (
             <DashboardView 
                tasks={tasks} 
                questionBanks={questionBanks} 
                onAction={handleAction} 
                onGenerateBank={bank => setGeneratingBank(bank)}
             />
          )}
          
          {/* 题库相关视图 */}
          {currentView === 'questionBank' && (
            <>
              <QuestionBankView 
                 banks={questionBanks} 
                 onGenerate={bank => setGeneratingBank(bank)}
              />
              {generatingBank && (
                 <GenerateIndicatorsModal 
                    bank={generatingBank} 
                    onClose={() => setGeneratingBank(null)}
                    onGenerate={handleGenerateConfig}
                 />
              )}
            </>
          )}

          {currentView === 'tasks' && <TaskListView tasks={tasks} onAction={handleAction} />}
          {currentView === 'action-config' && <Step1ConfigRubrics task={selectedTask} onComplete={handleConfigComplete} onExit={() => setCurrentView('questionBank')} />}
          {currentView === 'action-review' && <Step2ReviewStudents task={selectedTask} onExit={() => setCurrentView('tasks')} />}
        </Layout>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
